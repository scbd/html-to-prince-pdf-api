# Secrets required:
#
# Registry (org-level):
#   DOCKERHUB_USERNAME  - Docker Hub username
#   DOCKERHUB_TOKEN     - Docker Hub access token
#
# Deployment webhook (repo-level, optional - omit if no deploy target):
#   WEBHOOK_URL_DEV     - Portainer service webhook URL for dev redeploy

name: CI

on:
  push:
    branches: ['**']
    # Calver tags only: YYYY.N or YYYY.N.N (e.g. 2026.48.0) - no leading v
    tags: ['[0-9][0-9][0-9][0-9].[0-9]*']
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

env:
  IMAGE_NAME: scbd/html-to-prince-pdf-api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Logic:
      #   calver tag (YYYY.N.N) -> tags=<tag> + latest, push=true
      #   dev branch            -> tags=dev,            push=true (+ dev webhook)
      #   anything else         -> tags=build-<sha>,    push=false (build + test only)
      - name: Resolve image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMAGE="${{ env.IMAGE_NAME }}"
          REF="${GITHUB_REF}"

          if [[ "${REF}" =~ ^refs/tags/[0-9]{4}\.[0-9]+(\.[0-9]+)*$ ]]; then
            TAG="${REF#refs/tags/}"
            echo "tags<<EOF"          >> $GITHUB_OUTPUT
            echo "${IMAGE}:${TAG}"    >> $GITHUB_OUTPUT
            echo "${IMAGE}:latest"    >> $GITHUB_OUTPUT
            echo "EOF"                >> $GITHUB_OUTPUT
            echo "push=true"          >> $GITHUB_OUTPUT
            echo "branch="            >> $GITHUB_OUTPUT

          elif [[ "${REF}" == "refs/heads/dev" ]]; then
            echo "tags=${IMAGE}:dev" >> $GITHUB_OUTPUT
            echo "push=true"         >> $GITHUB_OUTPUT
            echo "branch=dev"        >> $GITHUB_OUTPUT

          else
            echo "tags=${IMAGE}:build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "push=false"                        >> $GITHUB_OUTPUT
            echo "branch="                           >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          build-args: COMMIT=${{ github.sha }}
          load: true
          tags: ci-build:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the image on its port (7070), wait until Express answers, render a
      # real PDF through Prince (no license or external service needed; the
      # output is just watermarked), then run the repo's node:test smoke suite
      # inside the image. Prints docker logs on any failure.
      - name: Test image
        run: |
          set -euo pipefail
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "::group::docker logs app"; docker logs app || true; echo "::endgroup::"; fi' EXIT

          docker run --name app -d -p 7070:7070 ci-build:local

          # There is no GET route, so a 404 from Express means the server is up.
          up=""
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' app)" != "true" ]; then
              echo "::error::Container exited before the server started"
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7070/ || true)
            if [ "$code" = "404" ]; then up=1; break; fi
            sleep 2
          done
          [ -n "$up" ] || { echo "::error::Server did not answer on port 7070"; exit 1; }

          curl -fsS --max-time 60 -X POST -H 'content-type: text/html' \
            --data '<html><body><h1>CI smoke test</h1></body></html>' \
            -o smoke.pdf http://localhost:7070/api/render
          [ "$(head -c 5 smoke.pdf)" = "%PDF-" ] || { echo "::error::Response is not a PDF"; exit 1; }
          echo "Rendered PDF: $(wc -c < smoke.pdf) bytes"

          docker run --rm ci-build:local npm test

      - name: Push image
        if: steps.meta.outputs.push == 'true'
        run: |
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker tag ci-build:local "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      # Portainer webhook - non-critical, a failed redeploy never blocks CI.
      - name: Deploy to Portainer (dev)
        if: steps.meta.outputs.branch == 'dev'
        continue-on-error: true
        uses: newarifrh/portainer-service-webhook@v1
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL_DEV }}
